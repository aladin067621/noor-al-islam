name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          cache: true

      - name: Generate Android wrapper files
        run: flutter create --platforms=android --org com.noor --project-name islamic_app .

      - name: Fetch packages
        run: flutter pub get

      - name: Build release APK
        run: |
          set +e
          flutter build apk --release 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noor-al-islam-build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: warn

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: noor-al-islam-release-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: إصدار التطبيق ${{ github.run_number }}
          body: |
            حمّل التطبيق من الملف المرفق أدناه (app-release.apk).
            بعد التحميل افتح الملف على هاتفك واسمح بالتثبيت من مصادر غير معروفة.
          files: build/app/outputs/flutter-apk/app-release.apk
