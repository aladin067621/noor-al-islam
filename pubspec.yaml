name: islamic_app
description: تطبيق إسلامي شامل — القرآن والسنة وفهم السلف الصالح
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  intl: ^0.19.0
  hijri: ^3.0.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  adhan_dart: ^2.0.1
  sensors_plus: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# إصلاح خطأ البناء في Flutter 3.24.x: geolocator_android 4.6.2 يستخدم
# flutter.compileSdkVersion الذي لا يتوفّر في هذه النسخة من Flutter.
# تثبيت 4.6.1 يمنع خطأ "compileSdkVersion is not specified".
dependency_overrides:
  geolocator_android: 4.6.1

flutter:
  uses-material-design: true

  assets:
    - assets/adhkar/
    - assets/books/
    - assets/prayer/
    - assets/tawheed/
    - assets/pillars/
    - assets/tafsir/
    - assets/config/
    - assets/references.md

  fonts:
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
